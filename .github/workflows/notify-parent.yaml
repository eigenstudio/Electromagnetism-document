name: Notify Parent Repository

on:
  push:
    branches:
      - main
      - alpha

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Parent Repo Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SUBMODULE_DISPATCH_TOKEN }}
          repository: eigenstudio-org/esd-documentation-website
          event-type: submodule_update
